[package]
name = "necro"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "File-board task manager for agents"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/douglance/necro"
repository = "https://github.com/douglance/necro"
publish = ["crates-io"]
keywords = ["tasks", "agents", "cli", "mcp", "markdown"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*.rs",
    "README.md",
    "LICENSE",
    "CONTEXT.md",
]

[[bin]]
name = "necro"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
incurs = { version = "0.5", default-features = false, features = ["cli", "mcp", "toon"] }
rustix = { version = "1", features = ["fs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
